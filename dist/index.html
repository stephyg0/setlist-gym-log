<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple weekly gym log for tracking workout time and exercises.">
  <title>Setlist — Gym Log</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cpath d='M13 25h7v14h-7zm31 0h7v14h-7zM20 29h24v6H20zM8 28h5v8H8zm43 0h5v8h-5z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root { --ink:#111; --muted:#707070; --paper:#fff; --card:#fff; --line:#e7e7e7; --hot:#111; --hot-dark:#111; --night:#111; --lime:#fff; }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .shell { max-width:1280px; margin:0 auto; padding:26px clamp(18px,4vw,52px) 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:760; letter-spacing:-.035em; font-size:1.16rem; }
    .brand-mark { width:28px; height:28px; display:grid; place-items:center; background:#111; border-radius:7px; }
    .brand-mark svg { width:19px; }
    .header-actions { display:flex; align-items:center; gap:9px; }
    .week-nav { display: flex; align-items: center; gap: 7px; }
    .icon-btn, .ghost-btn {
      border:1px solid var(--line); background:#fff; border-radius:8px; height:38px; cursor:pointer;
      transition:border-color .18s ease, background .18s ease;
    }
    .icon-btn { width:38px; font-size:1.25rem; line-height:1; }
    .ghost-btn { padding:0 12px; font-weight:680; font-size:.84rem; }
    .icon-btn:hover, .ghost-btn:hover { border-color:#bdbdbd; background:#fafafa; }
    .export-btn { height:38px; border:1px solid #111; background:#111; color:#fff; border-radius:8px; padding:0 13px; font-weight:700; font-size:.84rem; cursor:pointer; }
    .export-btn:hover { background:#333; }
    .top-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:24px; margin:48px 0 38px; }
    .intro { padding:0; }
    .eyebrow { display:none; }
    h1 { margin:0; font-size:clamp(2rem,4vw,3.6rem); line-height:1; letter-spacing:-.055em; font-weight:760; }
    .week-range { margin:12px 0 0; color:var(--muted); font-weight:500; }
    .score-card { min-width:260px; display:grid; grid-template-columns:auto auto; column-gap:22px; align-items:end; border-left:1px solid var(--line); padding:4px 0 4px 30px; }
    .score-label { grid-column:1/-1; margin:0 0 8px; color:var(--muted); font-size:.78rem; font-weight:600; }
    .score { display:flex; align-items:baseline; gap:6px; margin:0; }
    .score strong { font-size:2.7rem; letter-spacing:-.06em; line-height:1; font-weight:740; }
    .score span { color:var(--muted); font-size:.72rem; font-weight:700; }
    .score-meta { margin:0 0 3px; color:var(--muted); font-size:.8rem; line-height:1.4; }
    .score-meta b { display:block; color:var(--ink); font-weight:650; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:0 0 12px; }
    h2 { margin:0; font-size:1rem; letter-spacing:-.02em; }
    .section-hint { margin: 0; color: var(--muted); font-size: .86rem; }
    .week-grid { display:grid; grid-template-columns:repeat(7,minmax(140px,1fr)); gap:0; overflow-x:auto; border:1px solid var(--line); border-radius:10px; scrollbar-width:thin; }
    .day-card { min-height:225px; border-right:1px solid var(--line); background:#fff; padding:14px; display:flex; flex-direction:column; }
    .day-card:last-child { border-right:0; }
    .day-card.today { background:#fafafa; }
    .day-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .day-name { margin:0; font-weight:700; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; }
    .day-date { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }
    .day-duration { font-weight:650; font-size:.74rem; white-space:nowrap; }
    .day-card.today .day-duration { color:var(--ink); }
    .entries { display: grid; gap: 9px; margin: 18px 0; }
    .entry { border-left:1px solid #bbb; padding-left:9px; }
    .entry-time { display: block; font-weight: 800; font-size: .82rem; }
    .entry-exercises { display: block; color: var(--muted); font-size: .78rem; line-height: 1.35; margin-top: 2px; }
    .empty { margin:auto 0; color:#aaa; font-size:.79rem; line-height:1.4; }
    .add-btn { margin-top:auto; width:100%; border:0; background:transparent; padding:8px 0; text-align:left; font-weight:650; font-size:.78rem; cursor:pointer; color:var(--ink); }
    .add-btn:hover { text-decoration:underline; }
    .bottom-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:32px; margin-top:40px; }
    .panel { background:var(--card); border-top:1px solid var(--line); padding:20px 0; }
    .panel h3 { margin:0 0 18px; font-size: .97rem; }
    .bar-row { display:grid; grid-template-columns: 72px 1fr 50px; align-items:center; gap: 12px; margin: 13px 0; font-size: .8rem; }
    .bar-track { height:5px; background:#eee; border-radius:99px; overflow:hidden; }
    .bar-fill { height:100%; width:0; background:#111; border-radius:99px; transition:width .45s ease; }
    .bar-value { text-align:right; font-weight:800; }
    .exercise-list { display:flex; flex-wrap:wrap; gap:8px; }
    .exercise-chip { border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:.8rem; font-weight:600; background:#fff; }
    .exercise-chip b { color:var(--muted); margin-left:4px; }
    .panel-empty { color:var(--muted); font-size:.88rem; margin:0; }
    dialog { border:0; padding:0; width:min(500px,calc(100vw - 28px)); border-radius:12px; box-shadow:0 30px 90px rgba(0,0,0,.2); background:white; color:var(--ink); }
    dialog::backdrop { background:rgba(23,21,19,.54); backdrop-filter:blur(3px); }
    .dialog-body { padding:25px; }
    .dialog-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
    .dialog-head h2 { font-size:1.5rem; }
    .dialog-head p { margin:6px 0 0; color:var(--muted); font-size:.87rem; }
    .close-btn { border:0; background:#efede8; border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:1.2rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    label { display:grid; gap:7px; font-size:.8rem; font-weight:780; color:#484440; }
    label.full { grid-column:1 / -1; }
    input, textarea { width:100%; border:1px solid #cdc8c1; border-radius:10px; padding:11px 12px; background:#fbfaf8; color:var(--ink); outline:none; }
    input[type="file"] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    input:focus, textarea:focus { border-color:#111; box-shadow:0 0 0 3px rgba(0,0,0,.06); }
    textarea { min-height:92px; resize:vertical; line-height:1.45; }
    .photo-field { grid-column:1/-1; display:block; }
    .photo-label { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:8px; padding:9px 11px; cursor:pointer; font-size:.8rem; font-weight:650; background:#fff; }
    .photo-label:hover { background:#f7f7f7; }
    .photo-note { margin:8px 0 0; color:var(--muted); font-size:.75rem; font-weight:400; }
    .photo-preview { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
    .photo-item { position:relative; aspect-ratio:1; overflow:hidden; border-radius:8px; background:#f2f2f2; }
    .photo-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-remove { position:absolute; top:5px; right:5px; width:24px; height:24px; border:0; border-radius:50%; background:rgba(0,0,0,.72); color:white; cursor:pointer; line-height:1; }
    .photo-count { display:block; margin-top:5px; color:var(--muted); font-size:.73rem; }
    .dialog-actions { display:flex; justify-content:space-between; gap:12px; margin-top:22px; }
    .primary-btn { border:0; border-radius:8px; background:#111; color:white; padding:11px 17px; font-weight:700; cursor:pointer; }
    .primary-btn:hover { background:#333; }
    .danger-btn { display:none; border:0; background:transparent; color:#a12814; font-weight:760; cursor:pointer; }
    .danger-btn.visible { display:block; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 18px); background:var(--night); color:white; border-radius:12px; padding:12px 16px; font-weight:750; font-size:.86rem; opacity:0; pointer-events:none; transition:.25s; z-index:20; }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    @media (max-width: 800px) {
      .shell { padding-top:18px; }
      .top-grid, .bottom-grid { grid-template-columns:1fr; }
      .top-grid { margin:34px 0 28px; }
      .score-card { min-width:0; border-left:0; border-top:1px solid var(--line); padding:20px 0 0; }
      .section-head { align-items:start; flex-direction:column; gap:4px; }
      .week-grid { grid-template-columns:repeat(7, 78vw); scroll-snap-type:x mandatory; margin-right:-18px; }
      .day-card { scroll-snap-align:start; min-height:220px; }
    }
    @media (max-width: 500px) {
      .brand span:last-child { display:none; }
      .ghost-btn { padding:0 11px; }
      .form-grid { grid-template-columns:1fr; }
      label.full { grid-column:auto; }
      .header-actions { gap:6px; }
      .export-btn { padding:0 10px; }
      h1 { font-size:2.4rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 20"><path d="M1 6h4v8H1zm22 0h4v8h-4zM5 8h18v4H5z" fill="#fff"/></svg></span><span>Setlist</span></div>
      <div class="header-actions">
        <nav class="week-nav" aria-label="Week navigation">
          <button class="icon-btn" id="prevWeek" aria-label="Previous week">‹</button>
          <button class="ghost-btn" id="todayWeek">This week</button>
          <button class="icon-btn" id="nextWeek" aria-label="Next week">›</button>
        </nav>
        <button class="export-btn" id="exportData">Export CSV</button>
      </div>
    </header>

    <section class="top-grid">
      <div class="intro">
        <p class="eyebrow">Weekly training log</p>
        <h1>Gym log</h1>
        <p class="week-range" id="weekRange"></p>
      </div>
      <aside class="score-card" aria-label="Weekly summary">
        <p class="score-label">Total time this week</p>
        <div class="score"><strong id="totalHours">0</strong><span id="totalUnit">MIN</span></div>
        <p class="score-meta"><b id="sessionCount">0 sessions</b> logged across <span id="activeDays">0 days</span></p>
      </aside>
    </section>

    <div class="section-head">
      <h2>Your week</h2>
      <p class="section-hint">Tap any day to log a workout</p>
    </div>
    <section class="week-grid" id="weekGrid" aria-label="Workout days"></section>

    <section class="bottom-grid">
      <div class="panel">
        <h3>Time by day</h3>
        <div id="timeChart"></div>
      </div>
      <div class="panel">
        <h3>Exercises this week</h3>
        <div class="exercise-list" id="exerciseList"></div>
      </div>
    </section>
  </main>

  <dialog id="sessionDialog" aria-labelledby="dialogTitle">
    <form method="dialog" id="sessionForm" class="dialog-body">
      <div class="dialog-head">
        <div><h2 id="dialogTitle">Log workout</h2><p id="dialogDate"></p></div>
        <button type="button" class="close-btn" id="closeDialog" aria-label="Close">×</button>
      </div>
      <div class="form-grid">
        <label>Start time<input id="startTime" type="time" required></label>
        <label>End time<input id="endTime" type="time" required></label>
        <label class="full">Exercises<textarea id="exercises" required placeholder="e.g. Back squat, bench press, rows"></textarea></label>
        <div class="photo-field">
          <label class="photo-label" for="workoutPhotos">＋ Attach photos</label>
          <input id="workoutPhotos" type="file" accept="image/*" multiple>
          <p class="photo-note">Photos stay on this device.</p>
          <div class="photo-preview" id="photoPreview" aria-live="polite"></div>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="danger-btn" id="deleteSession">Delete session</button>
        <button type="submit" class="primary-btn">Save workout</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const STORE = 'setlist-gym-log-v1';
    let records = readRecords();
    let weekOffset = 0;
    let selectedDate = '';
    let editingId = null;
    let stagedPhotos = [];
    let attachedPhotoIds = [];

    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');
    const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    function readRecords() {
      try {
        const saved=JSON.parse(localStorage.getItem(STORE)) || [];
        return saved.filter(r=>!(r.date==='2026-09-21'&&r.start==='18:00'&&r.end==='19:15'&&r.exercises==='Back squat, Bench press, Seated row'));
      } catch { return []; }
    }
    function writeRecords() { localStorage.setItem(STORE, JSON.stringify(records)); }
    function openPhotoDb() {
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open('setlist-photos',1);
        request.onupgradeneeded=()=>request.result.createObjectStore('photos');
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
    }
    async function photoPut(id,blob) { const db=await openPhotoDb(); return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>reject(tx.error);}); }
    async function photoGet(id) { const db=await openPhotoDb(); return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),req=tx.objectStore('photos').get(id);req.onsuccess=()=>{db.close();resolve(req.result);};req.onerror=()=>reject(req.error);}); }
    async function photoDelete(id) { const db=await openPhotoDb(); return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>reject(tx.error);}); }
    function mondayFor(offset=0) {
      const d = new Date(); d.setHours(12,0,0,0);
      const delta = (d.getDay()+6)%7;
      d.setDate(d.getDate()-delta+(offset*7)); return d;
    }
    function weekDates() { const m=mondayFor(weekOffset); return DAYS.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;}); }
    function minutesBetween(start,end) {
      const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number);
      let mins=(eh*60+em)-(sh*60+sm); if(mins<0) mins+=1440; return mins;
    }
    function durationLabel(mins) {
      if (!mins) return '—';
      const h=Math.floor(mins/60), m=mins%60;
      return h ? `${h}h${m ? ` ${m}m` : ''}` : `${m}m`;
    }
    function formatRange(ds) {
      const a=ds[0], b=ds[6];
      if(a.getMonth()===b.getMonth()) return `${a.toLocaleDateString('en',{month:'long'})} ${a.getDate()}–${b.getDate()}, ${b.getFullYear()}`;
      return `${a.toLocaleDateString('en',{month:'short',day:'numeric'})} – ${b.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}`;
    }
    function splitExercises(value) { return value.split(/,|\n/).map(v=>v.trim()).filter(Boolean); }

    function render() {
      const dates=weekDates(), keys=dates.map(dateKey), weekRecords=records.filter(r=>keys.includes(r.date));
      $('weekRange').textContent=formatRange(dates);
      const total=weekRecords.reduce((sum,r)=>sum+minutesBetween(r.start,r.end),0);
      if(total>=60){ $('totalHours').textContent=(total/60).toFixed(total%60?1:0); $('totalUnit').textContent='HOURS'; }
      else { $('totalHours').textContent=total; $('totalUnit').textContent='MIN'; }
      $('sessionCount').textContent=`${weekRecords.length} ${weekRecords.length===1?'session':'sessions'}`;
      $('activeDays').textContent=`${new Set(weekRecords.map(r=>r.date)).size} days`;
      const today=dateKey(new Date());
      $('weekGrid').innerHTML=dates.map((d,i)=>{
        const key=dateKey(d), entries=weekRecords.filter(r=>r.date===key).sort((a,b)=>a.start.localeCompare(b.start));
        const mins=entries.reduce((s,r)=>s+minutesBetween(r.start,r.end),0);
        return `<article class="day-card ${key===today?'today':''}">
          <div class="day-top"><div><p class="day-name">${DAYS[i].slice(0,3)}</p><p class="day-date">${d.toLocaleDateString('en',{month:'short',day:'numeric'})}${key===today?' · Today':''}</p></div><span class="day-duration">${durationLabel(mins)}</span></div>
          <div class="entries">${entries.length?entries.map(r=>`<button class="entry" data-edit="${r.id}" aria-label="Edit workout at ${r.start}" style="border-top:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer"><span class="entry-time">${r.start}–${r.end}</span><span class="entry-exercises">${splitExercises(r.exercises).join(' · ')}</span>${r.photoIds?.length?`<span class="photo-count">${r.photoIds.length} ${r.photoIds.length===1?'photo':'photos'}</span>`:''}</button>`).join(''):'<p class="empty">Rest day — or your next chance to show up.</p>'}</div>
          <button class="add-btn" data-date="${key}">＋ Log workout</button>
        </article>`;
      }).join('');
      renderChart(dates,weekRecords); renderExercises(weekRecords);
    }
    function renderChart(dates, weekRecords) {
      const totals=dates.map(d=>weekRecords.filter(r=>r.date===dateKey(d)).reduce((s,r)=>s+minutesBetween(r.start,r.end),0));
      const max=Math.max(...totals,60);
      $('timeChart').innerHTML=totals.map((m,i)=>`<div class="bar-row"><span>${DAYS[i]}</span><div class="bar-track"><div class="bar-fill" style="width:${m/max*100}%"></div></div><span class="bar-value">${m}m</span></div>`).join('');
    }
    function renderExercises(weekRecords) {
      const counts={}; weekRecords.forEach(r=>splitExercises(r.exercises).forEach(x=>{const clean=x.replace(/\s*\d+\s*[x×]\s*\d+.*/i,'').trim();counts[clean]=(counts[clean]||0)+1;}));
      const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      $('exerciseList').innerHTML=sorted.length?sorted.map(([name,count])=>`<span class="exercise-chip">${escapeHtml(name)} <b>×${count}</b></span>`).join(''):'<p class="panel-empty">Your exercise summary will appear after you log a workout.</p>';
    }
    function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    async function renderPhotoPreview() {
      const preview=$('photoPreview'); preview.innerHTML='';
      const existing=await Promise.all(attachedPhotoIds.map(async id=>({id,blob:await photoGet(id),saved:true})));
      [...existing.filter(x=>x.blob),...stagedPhotos].forEach(item=>{
        const url=URL.createObjectURL(item.blob), el=document.createElement('div'); el.className='photo-item';
        el.innerHTML=`<img src="${url}" alt="Workout attachment"><button type="button" class="photo-remove" data-photo-id="${item.id}" data-saved="${item.saved?'1':'0'}" aria-label="Remove photo">×</button>`;
        el.querySelector('img').onload=()=>URL.revokeObjectURL(url); preview.appendChild(el);
      });
    }
    async function openDialog(date,id=null) {
      selectedDate=date; editingId=id;
      const d=new Date(date+'T12:00:00');
      $('dialogDate').textContent=d.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'});
      const entry=id?records.find(r=>r.id===id):null;
      $('startTime').value=entry?.start||'17:30'; $('endTime').value=entry?.end||'18:30'; $('exercises').value=entry?.exercises||'';
      stagedPhotos=[]; attachedPhotoIds=[...(entry?.photoIds||[])]; $('workoutPhotos').value=''; await renderPhotoPreview();
      $('deleteSession').classList.toggle('visible',!!entry); $('sessionDialog').showModal();
      setTimeout(()=>$('startTime').focus(),30);
    }
    function showToast(message){ $('toast').textContent=message; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),1800); }
    function csvCell(value) { return `"${String(value ?? '').replace(/"/g,'""')}"`; }
    function exportWeek() {
      const dates=weekDates(), keys=dates.map(dateKey);
      const items=records.filter(r=>keys.includes(r.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
      const header=['Date','Day','Start time','End time','Duration (minutes)','Duration','Exercises','Photo count'];
      const rows=items.map(r=>{
        const mins=minutesBetween(r.start,r.end), day=new Date(r.date+'T12:00:00').toLocaleDateString('en',{weekday:'long'});
        return [r.date,day,r.start,r.end,mins,durationLabel(mins),splitExercises(r.exercises).join('; '),(r.photoIds||[]).length];
      });
      const total=items.reduce((sum,r)=>sum+minutesBetween(r.start,r.end),0);
      rows.push(['','','','','','','','']);
      rows.push(['Weekly total','','','',total,durationLabel(total),`${items.length} ${items.length===1?'session':'sessions'}`,items.reduce((sum,r)=>sum+(r.photoIds||[]).length,0)]);
      const csv='\ufeff'+[header,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=`gym-log-${keys[0]}-to-${keys[6]}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      showToast(items.length?'Spreadsheet exported':'Empty week exported');
    }

    $('weekGrid').addEventListener('click',e=>{
      const add=e.target.closest('[data-date]'); if(add) openDialog(add.dataset.date);
      const edit=e.target.closest('[data-edit]'); if(edit){const rec=records.find(r=>r.id===edit.dataset.edit);if(rec)openDialog(rec.date,rec.id);}
    });
    $('workoutPhotos').addEventListener('change',async e=>{
      const files=[...e.target.files].filter(file=>file.type.startsWith('image/')).slice(0,8-stagedPhotos.length-attachedPhotoIds.length);
      stagedPhotos.push(...files.map(file=>({id:crypto.randomUUID(),blob:file,saved:false})));
      await renderPhotoPreview();
    });
    $('photoPreview').addEventListener('click',async e=>{
      const remove=e.target.closest('[data-photo-id]'); if(!remove)return;
      const id=remove.dataset.photoId;
      if(remove.dataset.saved==='1') attachedPhotoIds=attachedPhotoIds.filter(x=>x!==id);
      else stagedPhotos=stagedPhotos.filter(x=>x.id!==id);
      await renderPhotoPreview();
    });
    $('sessionForm').addEventListener('submit',async e=>{
      e.preventDefault(); const start=$('startTime').value,end=$('endTime').value,exercises=$('exercises').value.trim();
      if(!start||!end||!exercises) return;
      for(const photo of stagedPhotos) await photoPut(photo.id,photo.blob);
      const previous=editingId?records.find(r=>r.id===editingId):null;
      const removed=(previous?.photoIds||[]).filter(id=>!attachedPhotoIds.includes(id)); await Promise.all(removed.map(photoDelete));
      const rec={id:editingId||crypto.randomUUID(),date:selectedDate,start,end,exercises,photoIds:[...attachedPhotoIds,...stagedPhotos.map(p=>p.id)]};
      records=editingId?records.map(r=>r.id===editingId?rec:r):[...records,rec]; writeRecords(); $('sessionDialog').close(); render(); showToast(editingId?'Workout updated':'Workout logged');
    });
    $('deleteSession').addEventListener('click',async()=>{ if(!editingId)return; const rec=records.find(r=>r.id===editingId);await Promise.all((rec?.photoIds||[]).map(photoDelete));records=records.filter(r=>r.id!==editingId);writeRecords();$('sessionDialog').close();render();showToast('Workout deleted'); });
    $('closeDialog').addEventListener('click',()=>$('sessionDialog').close());
    $('prevWeek').addEventListener('click',()=>{weekOffset--;render();});
    $('nextWeek').addEventListener('click',()=>{weekOffset++;render();});
    $('todayWeek').addEventListener('click',()=>{weekOffset=0;render();});
    $('exportData').addEventListener('click',exportWeek);

    function registerTools(){
      const mc=document.modelContext; if(!mc?.registerTool)return;
      const register=(tool)=>Promise.resolve(mc.registerTool(tool)).catch(()=>{});
      register({name:'log_workout',title:'Log workout',description:'Add a gym session with date, start time, end time, and exercises.',inputSchema:{type:'object',properties:{date:{type:'string',pattern:'^\\d{4}-\\d{2}-\\d{2}$'},start:{type:'string',pattern:'^\\d{2}:\\d{2}$'},end:{type:'string',pattern:'^\\d{2}:\\d{2}$'},exercises:{type:'string',minLength:1}},required:['date','start','end','exercises'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!/^\d{4}-\d{2}-\d{2}$/.test(input?.date||'')||!/^\d{2}:\d{2}$/.test(input?.start||'')||!/^\d{2}:\d{2}$/.test(input?.end||'')||!String(input?.exercises||'').trim())throw new Error('Valid date, times, and exercises are required.');const rec={id:crypto.randomUUID(),date:input.date,start:input.start,end:input.end,exercises:String(input.exercises).trim()};records.push(rec);writeRecords();render();return {id:rec.id,status:'logged',duration_minutes:minutesBetween(rec.start,rec.end)};}});
      register({name:'read_weekly_progress',title:'Read weekly progress',description:'Read workout totals and sessions for the currently displayed week.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){const keys=weekDates().map(dateKey),items=records.filter(r=>keys.includes(r.date));return {week_start:keys[0],week_end:keys[6],total_minutes:items.reduce((s,r)=>s+minutesBetween(r.start,r.end),0),sessions:items};}});
    }
    render(); registerTools();
  </script>
</body>
</html>
